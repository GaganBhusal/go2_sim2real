runner:
  num_steps_per_env: 48
  save_interval: 10

  obs_groups:
    actor: ["policy"]
    critic: ["privileged"]

  algorithm:
    class_name: PPO
    num_learning_epochs: 4
    num_mini_batches: 4

  actor:
    class_name: MLPModel
    obs_normalization: true
    hidden_dims: [512, 256, 128]
    activation: elu
    distribution_cfg:
      class_name: GaussianDistribution

  critic:
    class_name: MLPModel
    obs_normalization: true
    hidden_dims: [512, 256, 128]
    activation: elu